<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Lista de Compras</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      var t = localStorage.getItem("appmarket.tema") || "auto";
      var escuro = t === "escuro" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      if (escuro) document.documentElement.dataset.tema = "escuro";
    })();
  </script>
</head>
<body>
  <main id="app"></main>
  <noscript>Este aplicativo precisa de JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
